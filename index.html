<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bensel — dijital defter</title>
  <style>
    :root {
      --bg: #faf9f6;
      --dot: #e2e0d8;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #6b655e;
      --line: #e7e5e4;
      --accent: #1c1917;
      --accent-text: #faf9f6;
      --tag-bg: #f3f1ec;
    }

    [data-theme="sepia"] {
      --bg: #f4ecd8;
      --dot: #dfd3b8;
      --card: #faf4e6;
      --text: #3d3122;
      --muted: #78664e;
      --line: #e2d5ba;
      --accent: #5c4326;
      --accent-text: #faf4e6;
      --tag-bg: #ece1c6;
    }

    [data-theme="dark"] {
      --bg: #141413;
      --dot: #262624;
      --card: #1c1c1a;
      --text: #f2f0ea;
      --muted: #9e9b93;
      --line: #2d2d2a;
      --accent: #f2f0ea;
      --accent-text: #141413;
      --tag-bg: #262623;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 22px 22px;
      color: var(--text);
      line-height: 1.65;
      transition: background-color 0.25s ease, color 0.25s ease;
      padding: 28px 18px 60px;
    }

    .notebook {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Üst Bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--line);
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .theme-switcher {
      display: flex;
      gap: 6px;
      background: var(--card);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    /* Giriş Bölümü */
    .hero {
      margin-bottom: 32px;
    }

    .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.75rem, 4vw, 2.3rem);
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.02rem;
      max-width: 580px;
    }

    /* İnteraktif Not Kartı */
    .note-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 36px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      position: relative;
    }

    .note-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.18rem;
      line-height: 1.6;
      min-height: 60px;
      margin-bottom: 18px;
      transition: opacity 0.18s ease;
    }

    .note-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .note-tag {
      font-size: 0.82rem;
      background: var(--tag-bg);
      color: var(--muted);
      padding: 4px
